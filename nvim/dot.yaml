windows:
  installs:
    cmd: scoop install neovim 
    depends:
      - scoop
  links:
    init.lua: ~\AppData\Local\nvim\init.lua
    lua: ~\AppData\Local\nvim\lua
    after: ~\AppData\Local\nvim\after


linux:
  installs:
    cmd: sudo pacman -Sy --noconfirm neovim
  links:
    init.lua: ~/.config/nvim/init.lua
    lua: ~/.config/nvim/lua
